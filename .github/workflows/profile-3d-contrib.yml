name: Gerar gráfico 3D de contribuições

on:
  schedule:
    - cron: "43 */4 * * *" # a cada 4 horas (minuto 43)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main # regenera a cada push na main (README, workflows, conf, etc.)
    paths-ignore:
      - "profile/**" # cards de estatísticas não afetam o gráfico 3D

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - name: Validar GH_PAT e contribuicoes privadas
        id: token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -z "${GH_PAT:-}" ]; then
            echo "value=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning title=GH_PAT ausente::O secret GH_PAT nao esta definido; usando GITHUB_TOKEN (apenas contribuicoes publicas)."
            exit 0
          fi

          if ! curl -fsS -o /dev/null \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user; then
            echo "value=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning title=GH_PAT invalido::O secret GH_PAT esta ausente, expirado ou revogado (401); usando GITHUB_TOKEN (apenas contribuicoes publicas)."
            exit 0
          fi

          echo "value=${GH_PAT}" >> "$GITHUB_OUTPUT"
          echo "Usando o secret GH_PAT."

          contrib=$(curl -fsS \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Content-Type: application/json" \
              https://api.github.com/graphql \
              -d '{"query":"query{viewer{contributionsCollection{restrictedContributionsCount commitContributionsByRepository(maxRepositories:100){repository{isPrivate}}}}}"}')
          private_repos=$(printf '%s' "$contrib" | jq '[.data.viewer.contributionsCollection.commitContributionsByRepository[] | select(.repository.isPrivate)] | length' 2>/dev/null || echo 0)
          restricted=$(printf '%s' "$contrib" | jq -r '.data.viewer.contributionsCollection.restrictedContributionsCount // 0' 2>/dev/null || echo 0)

          if [ "${private_repos:-0}" = "0" ] && [ "${restricted:-0}" = "0" ]; then
            echo "::warning title=Contribuicoes privadas nao detectadas::O calendario visto pelo token nao inclui contribuicoes privadas. Ative 'Include private contributions on my profile' (Settings > Public profile) ou use um token classico (ghp_) com escopo 'repo'. Sem isso, este grafico mostra apenas contribuicoes publicas."
          else
            echo "Contribuicoes privadas detectadas (repos privados=${private_repos}, restritas=${restricted})."
          fi

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Token pessoal (secret GH_PAT) valido para incluir contribuicoes de
          # repos privados; se estiver ausente/invalido, cai no token padrao.
          GITHUB_TOKEN: ${{ steps.token.outputs.value }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      # A action desenha um grafico de rosca de linguagens embutido que fica
      # sempre errado ("CSS + other") com token fine-grained, e nao ha opcao
      # para desliga-lo. Removemos esse grupo dos SVGs antes de publicar.
      - name: Remover grafico de rosca de linguagens dos SVGs
        run: node .github/scripts/remove-pie.js profile-3d-contrib

      # publica os SVGs no branch "output-3d-contrib", referenciado pelo README
      - name: Publicar SVGs no branch output-3d-contrib
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d-contrib
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
