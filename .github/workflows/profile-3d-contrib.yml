name: Gerar gráfico 3D de contribuições

on:
  schedule:
    - cron: "43 */4 * * *" # a cada 4 horas (minuto 43)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main # regenera a cada push na main (README, workflows, conf, etc.)
    paths-ignore:
      - "profile/**" # cards de estatísticas não afetam o gráfico 3D

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Token pessoal (secret GH_PAT) para incluir contribuições de repos
          # privados. Se o segredo ainda não existir, usa o token padrão do Actions.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || github.token }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      # publica os SVGs no branch "output-3d-contrib", referenciado pelo README
      - name: Publicar SVGs no branch output-3d-contrib
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d-contrib
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
