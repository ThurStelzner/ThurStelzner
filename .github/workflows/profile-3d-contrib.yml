name: Gerar gráfico 3D de contribuições

on:
  schedule:
    - cron: "43 */4 * * *" # a cada 4 horas (minuto 43)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main # regenera a cada push na main (README, workflows, conf, etc.)
    paths-ignore:
      - "profile/**" # cards de estatísticas não afetam o gráfico 3D

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - name: Validar GH_PAT
        id: token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${GH_PAT:-}" ] && curl -fsS -o /dev/null \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user; then
            echo "value=${GH_PAT}" >> "$GITHUB_OUTPUT"
            echo "Usando o secret GH_PAT (inclui contribuicoes de repos privados)."
          else
            echo "value=${{ github.token }}" >> "$GITHUB_OUTPUT"
            echo "::warning title=GH_PAT invalido::O secret GH_PAT esta ausente, expirado ou revogado (401). Usando o GITHUB_TOKEN padrao; contribuicoes de repositorios privados NAO serao contadas ate renovar o GH_PAT."
          fi

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          # Token pessoal (secret GH_PAT) valido para incluir contribuicoes de
          # repos privados; se estiver ausente/invalido, cai no token padrao.
          GITHUB_TOKEN: ${{ steps.token.outputs.value }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      # publica os SVGs no branch "output-3d-contrib", referenciado pelo README
      - name: Publicar SVGs no branch output-3d-contrib
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d-contrib
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
