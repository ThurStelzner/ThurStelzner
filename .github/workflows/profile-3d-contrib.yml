name: Gerar gráfico 3D de contribuições

on:
  schedule:
    - cron: "0 0,12 * * *" # 2x ao dia (00h e 12h UTC)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-3d-contrib.yml"
      - "conf/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5

      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: conf/github-profile-3d-contrib.json

      # publica os SVGs no branch "output-3d-contrib", referenciado pelo README
      - name: Publicar SVGs no branch output-3d-contrib
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output-3d-contrib
          build_dir: profile-3d-contrib
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
