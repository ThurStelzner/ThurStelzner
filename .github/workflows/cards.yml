name: Atualizar paleta e cards de estatísticas (público + privado)

on:
  schedule:
    - cron: "12 */6 * * *" # a cada 6 horas
  workflow_dispatch: # permite rodar manualmente
    inputs:
      force_palette:
        description: "Recalcular a paleta mesmo sem mudança no avatar"
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cards.yml"
      - ".github/scripts/palette.py"
      - ".github/palette.json"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Atualizar paleta a partir do avatar
        id: palette
        env:
          FORCE_PALETTE: ${{ github.event.inputs.force_palette || 'false' }}
        run: python .github/scripts/palette.py

      - name: Publicar paleta
        if: steps.palette.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/palette.json conf/github-profile-3d-contrib.json
          if git diff --cached --quiet; then
            echo "Sem alterações de paleta para publicar."
            exit 0
          fi
          git commit -m "Atualiza paleta do perfil a partir do avatar"
          git push

      - name: Criar pasta profile
        run: mkdir -p profile

      - name: Gerar card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "${{ steps.palette.outputs.stats_options }}"
          path: profile/estatisticas.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gerar card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "${{ steps.palette.outputs.langs_options }}"
          path: profile/linguagens.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          fail_on_error: true

      - name: Gerar card de sequência
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "${{ steps.palette.outputs.streak_options }}"
          path: profile/sequencia.svg
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Publicar cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Sem alterações nos cards para publicar."
            exit 0
          fi
          git commit -m "Atualiza cards de estatísticas (público + privado)"
          git push
