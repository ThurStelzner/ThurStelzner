name: Atualizar cards de estatísticas (público + privado)

on:
  schedule:
    - cron: "12 */6 * * *" # a cada 6 horas
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cards.yml"
      - ".github/scripts/palette.py"
      - ".github/palette.json"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validar GH_PAT
        id: token
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "${GH_PAT:-}" ] && curl -fsS -o /dev/null \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/user; then
            echo "value=${GH_PAT}" >> "$GITHUB_OUTPUT"
            echo "Usando o secret GH_PAT (inclui contribuicoes de repos privados)."
          else
            echo "value=${{ secrets.GITHUB_TOKEN }}" >> "$GITHUB_OUTPUT"
            echo "::warning title=GH_PAT invalido::O secret GH_PAT esta ausente, expirado ou revogado (401). Usando o GITHUB_TOKEN padrao; contribuicoes de repositorios privados NAO serao contadas ate renovar o GH_PAT."
          fi

      - name: Ler paleta atual
        id: palette
        run: python3 .github/scripts/palette.py --outputs-only

      - name: Criar pasta profile
        run: mkdir -p profile

      - name: Gerar card de estatísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: "${{ steps.palette.outputs.stats_options }}"
          path: profile/estatisticas.svg
          token: ${{ steps.token.outputs.value }}
          fail_on_error: true

      - name: Gerar card de linguagens
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: "${{ steps.palette.outputs.langs_options }}"
          path: profile/linguagens.svg
          token: ${{ steps.token.outputs.value }}
          fail_on_error: true

      - name: Gerar card de sequência
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: "${{ steps.palette.outputs.streak_options }}"
          path: profile/sequencia.svg
          token: ${{ steps.token.outputs.value }}

      - name: Publicar cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          if git diff --cached --quiet; then
            echo "Sem alterações nos cards para publicar."
            exit 0
          fi
          git commit -m "Atualiza cards de estatísticas (público + privado)"
          git push
