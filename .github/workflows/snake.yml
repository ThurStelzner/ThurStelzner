name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "23 * * * *" # a cada hora (minuto 23)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main # regenera a cada push na main (README, workflows, etc.)

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Token pessoal (secret GH_PAT) para incluir contribuições de repos
          # privados. Se o segredo ainda não existir, usa o token padrão do Actions.
          github_token: ${{ secrets.GH_PAT || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%239333EA&color_dots=%23F3E8FF,%23E9D5FF,%23D8B4FE,%23C084FC,%23A855F7
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF3EA5&color_dots=%232E1065,%235B21B6,%239333EA,%23D946EF,%23FF3EA5

      # publica os SVGs no branch "output", referenciado pelo README
      - name: Publicar SVGs no branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
