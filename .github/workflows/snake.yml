name: Gerar cobrinha de contribuições

on:
  schedule:
    - cron: "23 * * * *" # a cada hora (minuto 23)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main # regenera a cada push na main (README, workflows, etc.)
    paths-ignore:
      - "profile/**" # cards de estatísticas não afetam a cobrinha

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Ler paleta do perfil
        id: palette
        run: python .github/scripts/palette.py --outputs-only

      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Token pessoal (secret GH_PAT) para incluir contribuições de repos
          # privados. Se o segredo ainda não existir, usa o token padrão do Actions.
          github_token: ${{ secrets.GH_PAT || github.token }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23${{ steps.palette.outputs.snake_light_snake }}&color_dots=${{ steps.palette.outputs.snake_light_dots }}
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23${{ steps.palette.outputs.snake_dark_snake }}&color_dots=${{ steps.palette.outputs.snake_dark_dots }}

      # publica os SVGs no branch "output", referenciado pelo README
      - name: Publicar SVGs no branch output
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
