name: Gerar estatísticas do perfil (metrics)

on:
  schedule:
    - cron: "37 3,15 * * *" # 2x ao dia (00h e 12h em Brasília)
  workflow_dispatch: # permite rodar manualmente
  push:
    branches:
      - main
    paths:
      - ".github/workflows/metrics.yml"

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    name: generate-metrics
    steps:
      - uses: actions/checkout@v5

      - name: Preparar pasta de saída
        run: mkdir -p metrics

      # O token pessoal (secret GH_PAT) faz os cards incluírem repositórios
      # privados. Se o segredo ainda não existir, usa o token padrão do Actions.
      - name: Estatísticas gerais
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          user: ${{ github.repository_owner }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: America/Sao_Paulo
          filename: metrics/estatisticas.svg
          output_action: commit

      - name: Linguagens mais usadas
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          filename: metrics/linguagens.svg
          output_action: commit
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_other: yes

      - name: Atividade e hábitos
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_PAT || github.token }}
          user: ${{ github.repository_owner }}
          template: classic
          base: ""
          config_timezone: America/Sao_Paulo
          filename: metrics/habitos.svg
          output_action: commit
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_habits_charts_type: graph
          plugin_habits_trim: yes
